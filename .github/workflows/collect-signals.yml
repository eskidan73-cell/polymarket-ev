name: Collect Signals

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python collect_signals.py

      - name: Commit and push signals log
        run: |
          git config user.name "collect-signals-bot"
          git config user.email "collect-signals-bot@users.noreply.github.com"
          git add signals.csv
          git diff --cached --quiet || git commit -m "update signals log"
          git pull --rebase origin main
          git push
